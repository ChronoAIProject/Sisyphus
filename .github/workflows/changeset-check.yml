name: Changeset check

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

jobs:
  check-changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root devDeps (changesets)
        run: npm install --no-audit --no-fund --ignore-scripts --workspaces=false

      - name: Check for changeset
        run: |
          # Get list of changeset files added in this PR
          CHANGESETS=$(git diff --name-only origin/develop...HEAD -- '.changeset/*.md' | grep -v README.md || true)

          if [ -z "$CHANGESETS" ]; then
            echo "::error::This PR is missing a changeset. Run 'npx changeset' to create one."
            echo ""
            echo "If this change does not need a version bump (e.g., CI config, docs), add an empty changeset:"
            echo "  npx changeset --empty"
            exit 1
          fi

          echo "Changeset found: $CHANGESETS"
